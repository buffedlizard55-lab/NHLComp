name: research-and-site

# Runs the real pipeline against the live public APIs (this runner has outbound network,
# the development sandbox does not), regenerates the GitHub Pages site from the resulting
# ledger, and persists the ledger between runs.
#
# Persistence model:
#   * data/nhlcomp.db is the working ledger.  It is restored from the previous run's
#     Actions cache (so forward-test positions placed three hours ago are still there),
#     falling back to the committed snapshot data/ledger.db on a cold start.
#   * The site is deployed to Pages from the build output on every run on main.
#   * A snapshot (ledger + logs + docs) is committed back to the branch on code pushes,
#     manual runs and once a day -- not every three hours, so the repository does not
#     grow by a binary database eight times a day.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 */3 * * *"     # paper trading: quotes, candles, settlement, discovery
    - cron: "47 11 * * *"      # daily snapshot committed back to the branch
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SNAPSHOT: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '47 11 * * *') && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests (no network required)
        run: |
          python -m pip install --upgrade pip >/dev/null
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Restore the working ledger from the previous run
        id: ledger-cache
        uses: actions/cache/restore@v4
        with:
          path: data/nhlcomp.db
          key: ledger-v5-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ledger-v5-${{ github.ref_name }}-

      - name: Seed the ledger from the committed snapshot on a cold start
        run: |
          mkdir -p data
          if [ -f data/nhlcomp.db ]; then
            echo "ledger restored from cache ($(stat -c %s data/nhlcomp.db) bytes)"
          elif [ -f data/ledger.db ]; then
            cp data/ledger.db data/nhlcomp.db
            echo "ledger seeded from the committed snapshot ($(stat -c %s data/nhlcomp.db) bytes)"
          else
            echo "no prior ledger; starting empty"
          fi

      - name: Probe every registered data source
        run: |
          set -o pipefail
          PYTHONPATH=src python -m nhlcomp probe --db data/nhlcomp.db | tee data/probe.json

      - name: Ingest live data
        run: |
          set -eo pipefail
          CLUBS=ANA,BOS,BUF,CGY,CAR,CHI,CBJ,COL,DAL,DET,EDM,FLA,LAK,MIN,MTL,NSH,NJD,OTT,PHI,PIT,SEA,SJS,STL,TBL,TOR,UTA,VAN,VGK,WSH,WPG,NYI,NYR
          PYTHONPATH=src python -m nhlcomp ingest \
            --db data/nhlcomp.db \
            --seasons 20242025,20252026,20262027 \
            --stats-seasons 20242025,20252026,20262027 \
            --clubs "$CLUBS" \
            --settled-pages 8 \
            --kalshi-budget 1500 \
            --live-points-budget 120 \
            --cross-check-clubs TOR,BOS,EDM \
            2>&1 | tee data/ingest.log

      - name: Full pipeline (models, discovery, backtest, forward, settlement, verify)
        run: |
          set -eo pipefail
          PYTHONPATH=src python -m nhlcomp run \
            --db data/nhlcomp.db \
            --no-ingest \
            --seasons 20242025,20252026,20262027 \
            --game-types 2 \
            2>&1 | tee data/run.log

      - name: Verify (irregularity queue)
        run: |
          set -o pipefail
          PYTHONPATH=src python -m nhlcomp verify --db data/nhlcomp.db | tee data/verify.json

      - name: Report
        run: |
          set -o pipefail
          PYTHONPATH=src python -m nhlcomp report --db data/nhlcomp.db | tee data/report.txt

      - name: Build the GitHub Pages site from the ledger
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONPATH=src python -m nhlcomp build-site --db data/nhlcomp.db --site docs 2>&1 | tee data/site.log

      - name: Compact the ledger before caching
        if: always()
        run: |
          if [ -f data/nhlcomp.db ]; then
            python -c "import sqlite3; c=sqlite3.connect('data/nhlcomp.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.execute('VACUUM'); c.close()"
          fi
          ls -la data/ || true

      - name: Save the working ledger for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/nhlcomp.db
          key: ledger-v5-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload run artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-logs
          path: |
            data/probe.json
            data/ingest.log
            data/run.log
            data/verify.json
            data/report.txt
          if-no-files-found: ignore

      - name: Commit the snapshot (ledger, logs, site) back to the branch
        if: always() && github.event_name != 'pull_request' && env.SNAPSHOT == 'yes'
        run: |
          set -e
          git config user.name "nhlcomp-bot"
          git config user.email "nhlcomp-bot@users.noreply.github.com"
          mkdir -p data
          cp data/nhlcomp.db data/ledger.db || true
          for f in data/ledger.db data/probe.json data/verify.json data/report.txt \
                   data/ingest.log data/run.log data/site.log; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          [ -d docs ] && git add -f docs || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: refresh ledger, logs and site (generated from live public APIs)"
            # A push and a pull_request run for the same SHA overlap, and an earlier
            # commit-back may have advanced the branch underneath this checkout.  Rebase
            # onto whatever is actually on the remote and retry, rather than failing the
            # whole job over a bookkeeping commit.
            branch="${GITHUB_REF#refs/heads/}"
            for attempt in 1 2 3; do
              if git push origin "HEAD:refs/heads/${branch}"; then
                echo "pushed on attempt ${attempt}"
                break
              fi
              echo "push rejected (attempt ${attempt}); rebasing onto the remote branch"
              git fetch origin "${branch}"
              git -c user.name="nhlcomp-bot" -c user.email="nhlcomp-bot@users.noreply.github.com" \
                rebase "origin/${branch}" || git rebase --abort
              if [ "${attempt}" -eq 3 ]; then
                echo "::warning::could not commit regenerated artefacts back after 3 attempts"
              fi
              sleep 5
            done
          fi

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
