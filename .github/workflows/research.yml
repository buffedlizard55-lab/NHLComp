name: research-and-site

# Runs the real pipeline against the live public APIs (this runner has outbound network,
# the development sandbox does not), regenerates the GitHub Pages site from the resulting
# ledger, and commits it back to the branch that triggered the run.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 11 * * *"      # daily: refresh quotes, settle finished games, re-run discovery
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests (no network required)
        run: |
          python -m pip install --upgrade pip >/dev/null
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Probe every registered data source
        run: PYTHONPATH=src python -m nhlcomp probe --db data/nhlcomp.db | tee data/probe.json

      - name: Ingest live data
        run: |
          set -e
          CLUBS=ANA,BOS,BUF,CGY,CAR,CHI,CBJ,COL,DAL,DET,EDM,FLA,LAK,MIN,MTL,NSH,NJD,OTT,PHI,PIT,SEA,SJS,STL,TBL,TOR,UTA,VAN,VGK,WSH,WPG,NYI,NYR
          PYTHONPATH=src python -m nhlcomp ingest \
            --db data/nhlcomp.db \
            --seasons 20242025,20252026,20262027 \
            --clubs "$CLUBS" \
            --settled-pages 8 \
            --cross-check-clubs TOR,BOS,EDM \
            2>&1 | tee data/ingest.log

      - name: Full pipeline (models, discovery, backtest, forward, settlement, verify)
        run: |
          PYTHONPATH=src python -m nhlcomp run \
            --db data/nhlcomp.db \
            --no-ingest \
            --seasons 20242025,20252026,20262027 \
            --game-types 2 \
            2>&1 | tee data/run.log

      - name: Verify (irregularity queue)
        run: PYTHONPATH=src python -m nhlcomp verify --db data/nhlcomp.db | tee data/verify.json

      - name: Report
        run: PYTHONPATH=src python -m nhlcomp report --db data/nhlcomp.db | tee data/report.txt

      - name: Build the GitHub Pages site from the ledger
        run: PYTHONPATH=src python -m nhlcomp build-site --db data/nhlcomp.db --site docs

      - name: Upload run artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-logs
          path: |
            data/probe.json
            data/ingest.log
            data/run.log
            data/verify.json
            data/report.txt
          if-no-files-found: ignore

      - name: Commit regenerated site and ledger snapshot
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config user.name "nhlcomp-bot"
          git config user.email "nhlcomp-bot@users.noreply.github.com"
          mkdir -p data
          cp data/nhlcomp.db data/ledger.db || true
          git add -f docs data/ledger.db data/probe.json data/verify.json data/report.txt
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: refresh ledger, site and verification snapshot (generated from live public APIs; see data/report.txt and data/verify.json)"
            git push
          fi

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
